# M7 (production hardening): backend-api itself, running as a real
# in-cluster Deployment instead of only ever via `uvicorn` on a
# developer's own machine -- the more fundamental reachability gap named
# in docs/decisions/007-scope-pivot-production-hardening.md, ahead of
# persistence for the other four services. See
# docs/decisions/009-backend-api-in-cluster-deployment.md.
#
# ServiceAccount + Role + RoleBinding: backend-api's own code
# (main.py, builder.py) creates, polls, and deletes Kubernetes Jobs, and
# reads their pods' logs on failure -- an in-cluster pod only gets an
# *identity* from its service account token by default, not
# *authorization*. Scoped to the resources and subresources this code
# touches (confirmed directly from main.py/builder.py, not assumed):
# Jobs and the jobs/status subresource, Pods and the pods/log subresource
# (reading a Job's failed pod's logs needs this subresource specifically
# -- a bare `pods` grant does not implicitly cover it). The verb lists
# are a safe superset of what's individually exercised -- e.g. list/watch
# ride along with get as conventional companions rather than being
# enumerated per exact call site, and nothing here calls delete on
# jobs/status specifically -- a deliberate simplicity-over-precision
# choice, not an oversight.
# `jobs/status` is listed as its own resource too: builder.py/main.py poll
# a Job via `read_namespaced_job_status`, which the Kubernetes API server
# treats as a request against the `jobs/status` subresource, not `jobs`
# itself -- a bare `jobs` grant does not implicitly cover it either, the
# same subresource-is-separate pattern as pods/log above. Discovered live
# during Task 5's own end-to-end verification (a real
# `jobs.batch "..." is forbidden ... cannot get resource "jobs/status"`
# 403 from a real Kaniko build attempt, not a hypothetical) and fixed
# here rather than left for a future task, since it blocked every
# remaining verification step downstream of a macro build.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-api-job-manager
rules:
  - apiGroups: ["batch"]
    resources: ["jobs", "jobs/status"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-api-job-manager-binding
subjects:
  - kind: ServiceAccount
    name: backend-api
roleRef:
  kind: Role
  name: backend-api-job-manager
  apiGroup: rbac.authorization.k8s.io
---
# PersistentVolumeClaim for registry.db -- persistent from the very first
# deploy, never shipped on emptyDir even temporarily (unlike
# MinIO/Vault/Gitea/the registry, which started out emptyDir/unpersisted
# and were later given their own PVCs -- see docs/decisions/007's
# persistence item, 010, and 012; this was the first of the services to
# actually get real persistence, precisely because there was no reason to
# defer it just for this one).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-api-db
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      serviceAccountName: backend-api
      imagePullSecrets:
        - name: registry-push-secret
      containers:
        - name: backend-api
          image: registry:5000/backend-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: REGISTRY_DB_PATH
              value: /app/data/registry.db
            - name: GITEA_USERNAME
              # The account that owns the Vault-sourced secret/gitea
              # token (see vault_client.get_gitea_token(), read at
              # startup by main.py's lifespan() -- not a bare env-var
              # secret any more, see
              # docs/decisions/005-gitea-artifact-mirror.md's follow-up
              # note). This is an account name, not a secret, so it
              # stays a plain value here rather than a secretKeyRef.
              value: "macros"
            - name: GITEA_EXTERNAL_URL
              # Browser-facing Gitea address (see main.py's own comment
              # on this constant, and infra/gitea.yaml's NodePort
              # comment for why this isn't the same as gitea_client's
              # in-cluster GITEA_URL) -- genuinely per-machine (each
              # colleague's install has a different LAN IP), so it can't
              # be a literal value in this GitOps-managed manifest the
              # way GITEA_USERNAME above is. A first attempt tried
              # `kubectl set env` on the live Deployment after bootstrap
              # -- confirmed live that this doesn't work: ArgoCD's
              # selfHeal (infra/argocd-app.yaml) treats that as drift
              # from what's committed here and reverts it, sometimes
              # within the same bootstrap run. Sourced from a ConfigMap
              # instead -- ArgoCD only owns "read this key from this
              # ConfigMap", not the value itself, so there's nothing for
              # selfHeal to revert. scripts/bootstrap.sh's
              # ensure_gitea_external_url_configmap() creates/updates
              # backend-api-gitea-url (kubectl apply, not Git-tracked)
              # with this machine's real LAN IP, before ArgoCD's first
              # sync -- same "credential-shaped value the script manages
              # outside Git" pattern as vault-unseal-key's Secret below,
              # just a ConfigMap since this isn't a secret.
              valueFrom:
                configMapKeyRef:
                  name: backend-api-gitea-url
                  key: url
            - name: VAULT_TOKEN
              # Vault's real root token from its one-time `vault
              # operator init` (see
              # docs/decisions/012-vault-simplified-unseal.md) --
              # sourced from the same Secret the Vault pod's own
              # unseal sidecar reads its unseal key from
              # (infra/vault.yaml). Using the root token as
              # backend-api's own standing credential, rather than a
              # scoped policy/token, is a second named simplification
              # in that same doc -- not an oversight.
              valueFrom:
                secretKeyRef:
                  name: vault-unseal-key
                  key: root_token
          volumeMounts:
            - name: registry-db
              mountPath: /app/data
          # readinessProbe: gates whether the Service (below) routes
          # traffic to this pod. lifespan() does three sequential Vault
          # round-trips before FastAPI serves anything at all (including
          # /health itself), so a fresh/restarted pod that isn't ready
          # yet just fails this probe rather than getting real requests
          # routed to it and hanging until startup completes.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          # livenessProbe: restarts the container if it stops responding
          # after having started successfully (a wedged process, not a
          # slow-starting one). initialDelaySeconds is longer than the
          # readiness probe's so normal startup never races it into a
          # restart; periodSeconds/failureThreshold give a wedge ~30s of
          # failed checks (not one slow response) before Kubernetes acts.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          # Modest defaults for a small single-replica FastAPI service
          # with low internal traffic (this team's own macro
          # builds/runs, not public load). requests are low enough the
          # scheduler never struggles to place this pod; limits are
          # generous enough that normal build/poll traffic doesn't risk
          # an OOM-kill. Tunable once real usage patterns are observed
          # (no production metrics exist yet to size this more
          # precisely -- see docs/decisions/007's "Observability stays
          # out of scope for now").
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: registry-db
          persistentVolumeClaim:
            claimName: backend-api-db
---
# ClusterIP: reachable only from inside the cluster, at backend-api:8000.
# External/LAN reachability (something a colleague's own browser can
# actually reach) is deliberately a separate, later task -- see
# docs/decisions/007's ordering (persistence and internal reachability
# first, external reachability after that's proven working). Proven here
# via a temporary kubectl port-forward for testing only, not the final
# access method.
apiVersion: v1
kind: Service
metadata:
  name: backend-api
spec:
  type: ClusterIP
  selector:
    app: backend-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
# External/LAN reachability (M7) -- routes traffic through Traefik
# (already running in this cluster by default, see
# docs/superpowers/specs/2026-08-31-external-network-reachability-design.md's
# investigation) to the same ClusterIP Service used for kubectl
# port-forward during dev/testing. No `host:` field under rules[] --
# deliberately: an Ingress rule with no host matches ANY Host header,
# which is the portable choice since the real target machine's
# hostname/IP isn't confirmed yet. This works identically on any real
# cluster, not just this k3d/Docker Desktop setup.
#
# Reaching this from outside the cluster additionally requires Traefik's
# own LoadBalancer Service to have a real path to the host machine --
# confirmed absent right now (only port 6443 is published to the host;
# see the design spec's investigation) and requires a k3d cluster
# recreate with -p 80:80@loadbalancer -p 443:443@loadbalancer to fix,
# same class of one-time, creation-only Docker port-publish limitation
# already documented for --host-alias
# (docs/decisions/014-registry-dns-durable-fix.md). This Ingress resource
# itself is safe to apply immediately regardless -- it just has no path
# in from outside the cluster until that recreate happens.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-api
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-api
                port:
                  number: 8000
