# M5: Gitea, a self-hosted Git server -- this milestone's source for the
# Git repos ArgoCD will watch to drive GitOps deployment.
#
# Deployment (not a Job) because Gitea is a long-lived service, same
# reasoning as MinIO's Deployment in infra/minio.yaml and Vault's in
# infra/vault.yaml -- the opposite of a one-shot macro Job.
#
# SQLite via emptyDir, not a separate database: same non-persistent,
# local-dev-only spirit as MinIO's storage in M3 -- a pod restart wipes
# all repos and Gitea's own config. Fine for proving the Gitea-to-ArgoCD
# wiring works; a real PVC (and likely a real database, not SQLite) is a
# later concern once this needs to survive restarts.
#
# M7 (production hardening): /data is now PVC-backed, not emptyDir --
# still SQLite (a real external database remains a separate, larger
# decision not taken here), see the PersistentVolumeClaim below and
# docs/decisions/011-minio-gitea-registry-persistence.md. Swapping
# emptyDir for a PVC does not migrate the old emptyDir's contents (fresh,
# empty volume) -- this specific Deployment update required redoing the
# first-run admin account + API token through Gitea's web UI, updating
# Vault's secret/gitea to match, and rebuilding every existing macro to
# repopulate their mirrored repos; see that doc for the full sequence.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      containers:
        - name: gitea
          image: gitea/gitea:latest
          env:
            # SQLite needs no separate database service/credentials --
            # simplest option for local dev, same spirit as skipping a
            # real database for MinIO/Vault at this stage.
            - name: GITEA__database__DB_TYPE
              value: sqlite3
            - name: GITEA__database__PATH
              value: /data/gitea/gitea.db
            # Disable the interactive first-run install page so the
            # container comes up ready to use without a manual setup step.
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 22
              name: ssh
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitea-data
---
# M7 (production hardening): NodePort, not ClusterIP -- "View in Gitea"
# links in the frontend (services/frontend/src/pages/CatalogPage.jsx) are
# built from GITEA_URL (see infra/backend-api.yaml), which must resolve
# from an employee's own browser on the LAN, not just from inside the
# cluster. A Traefik Ingress was considered first (it already fronts
# backend-api on port 80, see the Ingress in infra/backend-api.yaml) but
# rejected: Gitea generates absolute links from its own ROOT_URL, so
# sharing port 80 would need either a host-based Ingress rule (requires a
# stable DNS name employees don't have) or a path prefix plus
# GITEA__server__USE_SUB_URL_PATH, which has known rough edges with
# asset/clone-URL rewriting -- not worth the risk for an internal tool. A
# dedicated NodePort keeps Gitea serving from its own root path with zero
# extra config, at the cost of one more port employees' machines must
# reach (see the fixed nodePort below and the k3d host-port publish in
# scripts/bootstrap.sh's ensure_cluster()).
#
# nodePort is pinned (not left to the 30000-32767 auto-assigned range) so
# scripts/bootstrap.sh's k3d host-port publish has a fixed target and
# GITEA_URL (infra/backend-api.yaml) can hardcode the matching port.
apiVersion: v1
kind: Service
metadata:
  name: gitea
spec:
  type: NodePort
  selector:
    app: gitea
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30300
    - name: ssh
      port: 22
      targetPort: 22
