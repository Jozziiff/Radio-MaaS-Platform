# M3: MinIO object storage, replacing the hostPath /data mount M1/M2 relied
# on for macro input/output files.
#
# Deployment (not a Job) because MinIO is a long-lived service that should
# keep running and be restarted if it crashes — the opposite of a macro run,
# which is a single task that should finish and stop.
#
# M7 (production hardening): /data is now PVC-backed, not emptyDir — see
# the PersistentVolumeClaim below and
# docs/decisions/011-minio-gitea-registry-persistence.md. Swapping
# emptyDir for a PVC does not migrate whatever was already in the old
# emptyDir (it's a fresh, empty volume) — this Deployment update requires
# re-seeding the two buckets afterward, same as any fresh cluster; see
# that doc for the full re-bootstrap sequence this one-time reset needed.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    # M5 GitOps proof: a trivial, visible change pushed to Git to confirm
    # ArgoCD's selfHeal/automated sync applies it without any manual
    # kubectl command -- see docs/decisions/ for the M5 writeup.
    demo: gitops-proof
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            # Plainly temporary dev credentials. These move into Vault +
            # External Secrets Operator in M4 — not before. Do not reuse
            # these values anywhere real.
            - name: MINIO_ROOT_USER
              value: devadmin
            - name: MINIO_ROOT_PASSWORD
              value: devpassword123
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
# ClusterIP: only reachable from inside the cluster, at minio:9000 (API) /
# minio:9001 (console) -- that's the point, other pods (macro Jobs, the
# backend-api) are the intended clients, not the outside world. Reaching it
# from the host for this verification step goes through kubectl
# port-forward instead of changing the Service type.
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  type: ClusterIP
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
