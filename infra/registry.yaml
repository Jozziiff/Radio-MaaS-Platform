# M7 (production hardening): the in-cluster image registry Kaniko pushes
# built macro images to, and execution Jobs pull them from -- replaces
# `docker build` + `k3d image import`, which required host Docker socket
# access. See docs/decisions/008-kaniko-instead-of-docker-socket.md.
#
# Deployment (not a Job) because this is a long-lived service, same
# reasoning as infra/minio.yaml, infra/vault.yaml, infra/gitea.yaml.
#
# htpasswd auth, not open access: this project's other in-cluster
# services (MinIO, Vault, Gitea) all have real credentials on top of
# their ClusterIP-only network isolation -- the registry follows the
# same posture rather than being the one exception. Network isolation
# alone is defense-in-depth here, not a substitute for auth.
#
# M7 (production hardening): image blob storage (/var/lib/registry, the
# registry:2 image's default data path) is now PVC-backed -- previously
# this had no volume at all, so every pushed layer lived only in the
# registry container's own ephemeral writable layer. See the
# PersistentVolumeClaim below and
# docs/decisions/011-minio-gitea-registry-persistence.md. Unlike
# MinIO/Gitea, nothing here needed a re-bootstrap sequence: there was no
# persistent state to lose in the first place, since this PVC didn't
# exist before.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: registry:2
          env:
            - name: REGISTRY_AUTH
              value: htpasswd
            - name: REGISTRY_AUTH_HTPASSWD_REALM
              value: "radio-maas-registry"
            - name: REGISTRY_AUTH_HTPASSWD_PATH
              value: /auth/htpasswd
          ports:
            - containerPort: 5000
              name: http
          volumeMounts:
            - name: auth
              mountPath: /auth
              readOnly: true
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: auth
          secret:
            # Populated by Task 2's `kubectl create secret generic
            # registry-htpasswd --from-file=htpasswd=...` -- the
            # Deployment references this Secret by name; it must exist
            # before this pod can start (same bring-up-order dependency
            # Vault/MinIO seeding already has for backend-api).
            secretName: registry-htpasswd
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
---
# ClusterIP: reachable only from inside the cluster at registry:5000 --
# same pattern as every other infra/*.yaml Service. Combined with
# htpasswd auth above: network isolation as defense-in-depth on top of
# real credentials, not instead of them.
#
# clusterIP is PINNED (not left to Kubernetes' dynamic allocation), unlike
# every other Service in this project. Reason: the k3d node's own
# containerd (which does the actual image pull/push) cannot resolve
# Kubernetes Service DNS names at all -- only CoreDNS can, and only pods
# reach CoreDNS. containerd needs a node-level /etc/hosts entry mapping
# "registry" to a real IP (via k3d's `--host-alias 10.43.99.99:registry`
# at cluster-creation time, see README.md's "Create the cluster" step and
# docs/decisions/008-kaniko-instead-of-docker-socket.md). That flag needs
# a fixed IP to point at *before* this Service exists (chicken-and-egg
# with dynamic allocation), so this Service pins its own ClusterIP to
# match -- 10.43.99.99 is in this cluster's default Service CIDR
# (10.43.0.0/16) and was confirmed unused by any other Service at the
# time this was set up.
apiVersion: v1
kind: Service
metadata:
  name: registry
spec:
  type: ClusterIP
  clusterIP: 10.43.99.99
  selector:
    app: registry
  ports:
    - name: http
      port: 5000
      targetPort: 5000
